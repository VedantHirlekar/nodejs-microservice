services:

  user-service:
    build:
      context: ./user-service

    container_name: user-service

    env_file:
      - ./user-service/.env

    expose:
    - "3001"

    networks:
      - microservices-network


  product-service:
    build:
      context: ./product-service

    container_name: product-service

    env_file:
      - ./product-service/.env

    expose:
    - "3002"

    networks:
      - microservices-network


  order-service:
    build:
      context: ./order-service

    container_name: order-service

    env_file:
      - ./order-service/.env

    expose:
    - "3003"

    depends_on:
      - user-service
      - product-service

    networks:
      - microservices-network


  payment-service:
    build:
      context: ./payment-service

    container_name: payment-service

    env_file:
      - ./payment-service/.env

    expose:
    - "3004"

    networks:
      - microservices-network


  notification-service:
    build:
      context: ./notification-service

    container_name: notification-service

    env_file:
      - ./notification-service/.env

    expose:
    - "3005"

    networks:
      - microservices-network


  nginx:
    image: nginx:alpine

    container_name: nginx-gateway

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service

    networks:
      - microservices-network


networks:
  microservices-network:
    driver: bridge